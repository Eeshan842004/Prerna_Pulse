# One command:  docker compose up --build    then open http://localhost:8000
# Demo settings only. For a school: set real secrets in .env, PP_DEMO_MODE=false, and put
# the API behind HTTPS (port 443) with a reverse proxy such as Caddy or nginx.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PP_DB_PASSWORD:-postgres}
      POSTGRES_DB: prerana
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prerana"]
      interval: 2s
      retries: 30

  init:   # creates the schema, the row-level-security role and the demo school, then exits
    build: { context: ., dockerfile: backend/Dockerfile }
    user: root
    command: ["python", "-m", "app.manage", "init"]
    env_file: [.env.example]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env.example]
    ports: ["8000:8000"]
    depends_on: { init: { condition: service_completed_successfully } }

  # One gateway process per place on the school map (simulated radio on :8081-:8086 for the virtual band).
  gw-7b:
    build: ./gateway
    command: ["python", "/srv/gateway.py", "--server", "http://api:8000", "--id", "gw-7b", "--token", "demo-token-gw-7b", "--port", "8081", "--heartbeat", "10"]
    ports: ["8081:8081"]
    depends_on: [api]

  gw-stairs:
    build: ./gateway
    command: ["python", "/srv/gateway.py", "--server", "http://api:8000", "--id", "gw-stairs", "--token", "demo-token-gw-stairs", "--port", "8082", "--heartbeat", "10"]
    ports: ["8082:8082"]
    depends_on: [api]

  gw-library:
    build: ./gateway
    command: ["python", "/srv/gateway.py", "--server", "http://api:8000", "--id", "gw-library", "--token", "demo-token-gw-library", "--port", "8083", "--heartbeat", "10"]
    ports: ["8083:8083"]
    depends_on: [api]

  gw-lab:
    build: ./gateway
    command: ["python", "/srv/gateway.py", "--server", "http://api:8000", "--id", "gw-lab", "--token", "demo-token-gw-lab", "--port", "8084", "--heartbeat", "10"]
    ports: ["8084:8084"]
    depends_on: [api]

  gw-playground:
    build: ./gateway
    command: ["python", "/srv/gateway.py", "--server", "http://api:8000", "--id", "gw-playground", "--token", "demo-token-gw-playground", "--port", "8085", "--heartbeat", "10"]
    ports: ["8085:8085"]
    depends_on: [api]

  gw-office:
    build: ./gateway
    command: ["python", "/srv/gateway.py", "--server", "http://api:8000", "--id", "gw-office", "--token", "demo-token-gw-office", "--port", "8086", "--heartbeat", "10"]
    ports: ["8086:8086"]
    depends_on: [api]

  # gw-blockb is deliberately not started, so the Devices tab shows a silent gateway.

volumes:
  pgdata:
